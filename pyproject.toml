[project]
name = "chagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Siarhei Psiola", email = "s.psiola@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "openai>=3.11.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "websockets>=13.0",
]

[project.scripts]
chagent = "chagent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

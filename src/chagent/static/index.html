<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chagent AI</title>
    <link rel="stylesheet" href="/static/styles.css?v=7">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-top">
                <label class="toggle-logs-label" title="Показывать системные логи">
                    <input type="checkbox" id="toggle-harness-logs" checked>
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    Логи
                </label>
                <button id="settings-btn" class="header-btn" title="Настройки">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Настройки
                </button>
            </div>
            <div class="header-bottom">
                <div class="logo">
                    <div class="logo-circle"></div>
                    <h1>Chagent <span>AI</span></h1>
                </div>
                <div style="display: flex; gap: 16px; align-items: center;">
                    <button id="copy-dialog-btn" class="header-btn" title="Скопировать диалог">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Скопировать диалог
                    </button>
                    <div class="status testing" id="connection-status" title="Connecting...">
                        <span class="status-dot"></span>
                        <select id="model-select" style="display: none;" class="header-btn" title="Выбор модели"></select>
                    </div>
                </div>
            </div>
        </header>

        <main class="chat-container" id="chat-container">
            <div class="welcome-message">
                <h2>Привет! Я твой ИИ-агент.</h2>
                <p>Я могу использовать инструменты и помогать с задачами.</p>
            </div>
        </main>

        <div class="input-area">
            <form id="chat-form">
                <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off" autofocus>
                <button type="submit" id="send-button">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="send-icon"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
            <div class="metrics-footer" id="metrics-status" style="display: none;" title="Примерное количество токенов в текущем контексте">
                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
                <span id="metrics-text">~0 tokens</span>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Настройки</h2>
                <button id="close-settings-btn" class="close-btn">&times;</button>
            </div>
            <div class="modal-main">
                <div class="modal-tabs">
                    <button class="tab-btn active" data-tab="tab-prompts">Память и Промпты</button>
                    <button class="tab-btn" data-tab="tab-structure">Структура контекста</button>
                    <button class="tab-btn" data-tab="tab-tools">Инструменты</button>
                    <button class="tab-btn" data-tab="tab-help">Справка</button>
                    <button class="tab-btn" data-tab="tab-stats">Статистика</button>
                    <button class="tab-btn" data-tab="tab-app">Интерфейс</button>
                </div>
                
                <div class="modal-body">
                <!-- Prompts Tab -->
                <div id="tab-prompts" class="tab-content active">
                    <div class="form-group">
                        <label for="prompt-context-select">Контекст модели</label>
                        <select id="prompt-context-select" class="form-control">
                            <option value="default">По умолчанию (все модели)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="system-prompt-label" for="system-prompt-textarea">Системный промпт</label>
                        <textarea id="system-prompt-textarea" class="form-control" rows="8"></textarea>
                    </div>
                    <button id="save-prompt-btn" class="primary-btn">Сохранить промпт</button>
                </div>
                
                <!-- Template Tab -->
                <div id="tab-structure" class="tab-content">
                    <div class="form-group">
                        <label for="system-template-textarea">Шаблон системы</label>
                        <textarea id="system-template-textarea" class="form-control" rows="5" style="font-family: monospace;"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="tool-rules-textarea">Правила инструментов</label>
                        <textarea id="tool-rules-textarea" class="form-control" rows="4"></textarea>
                    </div>
                    <button id="save-template-btn" class="save-btn">Сохранить структуру контекста</button>
                </div>

                <!-- Help Tab -->
                <div id="tab-help" class="tab-content">
                    <div id="help-markdown-container" class="markdown-body">
                        <!-- Сюда отрендерится md-файл справки -->
                    </div>
                </div>

                <!-- Tools Tab -->
                <div id="tab-tools" class="tab-content">
                    <div style="display: flex; justify-content: flex-end; margin-bottom: 12px;">
                        <label class="toggle-logs-label" title="Переключить между удобным видом и формальным JSON">
                            <input type="checkbox" id="tools-view-toggle">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            Формат JSON
                        </label>
                    </div>
                    <div id="tools-markdown-container" class="markdown-body">
                        <!-- Сюда отрендерится список инструментов -->
                    </div>
                </div>
                
                <!-- App Settings Tab -->
                <div id="tab-app" class="tab-content">
                    <div class="form-group">
                        <label for="theme-select">Тема оформления</label>
                        <select id="theme-select" class="form-control">
                            <option value="dark">Тёмная</option>
                            <option value="light">Светлая</option>
                            <option value="system">Системная</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="timezone-input">Часовой пояс</label>
                        <input type="text" id="timezone-input" class="form-control" value="UTC">
                    </div>
                    <button id="save-settings-btn" class="primary-btn">Сохранить настройки</button>
                </div>

                <!-- Stats Tab -->
                <div id="tab-stats" class="tab-content">
                    <div class="stats-header">
                        <h3>Статистика за текущую сессию</h3>
                        <button id="refresh-stats-btn" class="secondary-btn" title="Обновить статистику">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                        </button>
                    </div>
                    <div class="stats-summary" id="stats-summary-container">
                        <!-- Сводка отрендерится тут -->
                    </div>
                    <div class="table-container">
                        <table class="stats-table">
                            <thead>
                                <tr>
                                    <th>Время</th>
                                    <th>Модель</th>
                                    <th>Токены (in/out)</th>
                                    <th>Задержка (мс)</th>
                                </tr>
                            </thead>
                            <tbody id="stats-table-body">
                                <tr><td colspan="4" style="text-align: center;">Нет данных</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js?v=10"></script>
</body>
</html>
